[package]
name = "verifier"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dashmap = { version = "6.2.1", features=["serde"] }
env_logger = "0.11.11"
hex = "0.4.3"
libc = "0.2.189"
log = "0.4.34"
quiche = "0.30.0"
ring = "0.17.14"
rnd = "0.1.1"
serde = "1.0.229"
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] } 
